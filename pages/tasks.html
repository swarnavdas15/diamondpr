<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks & Kanban Board - Diamond Flanges & Fittings</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-container"></div>

      <main class="content-body">
        <div class="section-header">
          <div class="section-title-group">
            <h2>Task & Work Order Execution Board</h2>
            <p>Assign QA inspections, machining setups, vendor follow-ups, and track progress.</p>
          </div>
          <div class="section-actions">
            <div class="btn-group" style="display:flex; border:1px solid var(--border-color); border-radius:var(--radius-sm); overflow:hidden;">
              <button id="task-view-btn-kanban" class="btn btn-secondary active" onclick="switchTaskView('kanban')" style="border:none; border-radius:0;"><i class="fas fa-columns"></i> Kanban Board</button>
              <button id="task-view-btn-list" class="btn btn-secondary" onclick="switchTaskView('list')" style="border:none; border-radius:0;"><i class="fas fa-list"></i> Table View</button>
            </div>
            <button class="btn btn-primary" onclick="openModal('add-task-modal')"><i class="fas fa-plus"></i> New Task</button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="widget-card" style="margin-bottom:20px; padding:14px;">
          <div class="flex-space-between flex-wrap" style="gap:12px;">
            <div class="flex-row" style="flex:1; max-width:360px;">
              <input type="text" id="task-search-input" class="form-control" placeholder="Search tasks by title..." onkeyup="filterTasksContent()">
            </div>
            <div class="flex-row" style="gap:10px;">
              <select id="task-priority-filter" class="form-control" onchange="filterTasksContent()" style="width:160px;">
                <option value="">All Priorities</option>
                <option value="Urgent">Urgent</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
              </select>
              <select id="task-assignee-filter" class="form-control" onchange="filterTasksContent()" style="width:180px;">
                <!-- Rendered dynamically -->
              </select>
            </div>
          </div>
        </div>

        <!-- Task Wrapper -->
        <div id="tasks-content-wrapper"></div>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <div id="modals-container"></div>

  <script src="../data/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/tasks.js"></script>
</body>
</html>
