<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendors Directory - Diamond Flanges & Fittings</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-container"></div>

      <main class="content-body">
        <div class="section-header">
          <div class="section-title-group">
            <h2>Vendor & Raw Material Supply Chain</h2>
            <p>Manage raw steel forge suppliers, sub-contract heat treatment labs, and fastener suppliers.</p>
          </div>
          <div class="section-actions">
            <button class="btn btn-secondary" onclick="exportVendorsCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
            <button class="btn btn-primary" onclick="openModal('add-vendor-modal')"><i class="fas fa-plus"></i> Add Vendor</button>
          </div>
        </div>

        <div class="widget-card">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Vendor Code</th>
                  <th>Vendor Name</th>
                  <th>Contact Person</th>
                  <th>Material / Services Supplied</th>
                  <th>Rating</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="vendors-table-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <div id="modals-container"></div>

  <script src="../data/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/vendors.js"></script>
</body>
</html>
