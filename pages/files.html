<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Files & Drawings - Diamond Flanges & Fittings</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-container"></div>

      <main class="content-body">
        <div class="section-header">
          <div class="section-title-group">
            <h2>File & Engineering Drawings Repository</h2>
            <p>Centralized archive for ASME drawings, Mill Test Certificates (MTC 3.1), and third-party inspection reports.</p>
          </div>
          <div class="section-actions">
            <button class="btn btn-primary" onclick="showToast('File Upload Dialog Opened', 'info')"><i class="fas fa-cloud-arrow-up"></i> Upload Document</button>
          </div>
        </div>

        <div class="widget-card" style="margin-bottom:20px; padding:14px;">
          <div class="flex-space-between" style="font-size:13px; font-weight:600; margin-bottom:6px;">
            <span><i class="fas fa-hard-drive" style="color:var(--accent);"></i> Project Storage Quota</span>
            <span id="files-storage-text">6.3 MB / 50 MB (12% Used)</span>
          </div>
          <div class="progress-bar-bg">
            <div id="files-storage-fill" class="progress-bar-fill" style="width:12%;"></div>
          </div>
        </div>

        <div class="file-grid" id="files-grid-container"></div>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <div id="modals-container"></div>

  <script src="../data/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/files.js"></script>
</body>
</html>
