<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users & Org Chart - Diamond Flanges & Fittings</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <div id="sidebar-container"></div>

    <div class="main-wrapper">
      <div id="header-container"></div>

      <main class="content-body">
        <div class="section-header">
          <div class="section-title-group">
            <h2>Employee Directory & Organization Chart</h2>
            <p>Manage personnel profiles, roles, permissions, and executive reporting hierarchy.</p>
          </div>
          <div class="section-actions">
            <div class="btn-group" style="display:flex; border:1px solid var(--border-color); border-radius:var(--radius-sm); overflow:hidden;">
              <button id="user-tab-btn-list" class="btn btn-secondary active" onclick="switchUserTab('list')"><i class="fas fa-users"></i> Employee List</button>
              <button id="user-tab-btn-org" class="btn btn-secondary" onclick="switchUserTab('orgchart')"><i class="fas fa-sitemap"></i> Org Chart</button>
            </div>
          </div>
        </div>

        <div id="users-tab-content"></div>
      </main>

      <div id="footer-container"></div>
    </div>
  </div>

  <div id="modals-container"></div>

  <script src="../data/storage.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/users.js"></script>
</body>
</html>
