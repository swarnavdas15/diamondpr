<!-- REUSABLE MODALS & OVERLAYS COMPONENT -->

<!-- GLOBAL SEARCH MODAL (CTRL+K) -->
<div id="global-search-modal" class="modal-overlay">
  <div class="modal-container search-modal-container">
    <div class="search-input-wrapper">
      <i class="fas fa-search"></i>
      <input type="text" id="global-search-input" class="search-input-field" placeholder="Search across Projects, Tasks, Companies..." onkeyup="renderGlobalSearchResults(this.value)">
      <button class="modal-close-btn" onclick="closeModal('global-search-modal')">&times;</button>
    </div>
    <div id="global-search-results" class="search-results-list"></div>
  </div>
</div>

<!-- ADD / EDIT PROJECT MODAL -->
<div id="add-project-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Create / Edit Manufacturing Work Order</h3>
      <button class="modal-close-btn" onclick="closeModal('add-project-modal')">&times;</button>
    </div>
    <form id="project-form" onsubmit="handleSaveProject(event)">
      <input type="hidden" id="proj-id">
      <div class="modal-body grid-2col">
        <div class="form-group">
          <label>Project Number</label>
          <input type="text" id="proj-number" class="form-control" required placeholder="PRJ-2026-101">
        </div>
        <div class="form-group">
          <label>Client Name</label>
          <input type="text" id="proj-client" class="form-control" required placeholder="e.g. Larsen & Toubro">
        </div>
        <div class="form-group">
          <label>PO Number</label>
          <input type="text" id="proj-po" class="form-control" required placeholder="PO-LT-9988">
        </div>
        <div class="form-group">
          <label>PO Date</label>
          <input type="date" id="proj-po-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Delivery Target Date</label>
          <input type="date" id="proj-delivery-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Project Order Value (INR)</label>
          <input type="number" id="proj-value" class="form-control" required placeholder="500000">
        </div>
        <div class="form-group">
          <label>Lifecycle Status</label>
          <select id="proj-status" class="form-control">
            <option value="Work Order Pending">Work Order Pending</option>
            <option value="In Process">In Process</option>
            <option value="Vendor Material Pending">Vendor Material Pending</option>
            <option value="Waiting Client Approval">Waiting Client Approval</option>
            <option value="Part Dispatched">Part Dispatched</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Progress Percentage</label>
          <input type="number" id="proj-progress" class="form-control" min="0" max="100" value="10">
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label>Raw Material Status</label>
          <input type="text" id="proj-material-status" class="form-control" placeholder="e.g. SS 316L Rough Forgings In Stock">
        </div>
        <div class="form-group" style="grid-column: 1/-1;">
          <label>Dispatch Remarks & Notes</label>
          <textarea id="proj-notes" class="form-control" rows="2" placeholder="Hydrostatic test passed at 150 BAR..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('add-project-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Work Order</button>
      </div>
    </form>
  </div>
</div>

<!-- ADD / EDIT TASK MODAL -->
<div id="add-task-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">Create / Edit Task</h3>
      <button class="modal-close-btn" onclick="closeModal('add-task-modal')">&times;</button>
    </div>
    <form id="task-form" onsubmit="handleSaveTask(event)">
      <input type="hidden" id="task-id">
      <div class="modal-body grid-2col">
        <div class="form-group" style="grid-column:1/-1;">
          <label>Task Title</label>
          <input type="text" id="task-title" class="form-control" required placeholder="e.g. Inspect Final Packaging of 24 Flanges">
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="task-priority" class="form-control">
            <option value="Urgent">Urgent</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="task-status" class="form-control">
            <option value="To Do">To Do</option>
            <option value="In Progress">In Progress</option>
            <option value="Waiting on Vendor">Waiting on Vendor</option>
            <option value="Waiting on Client">Waiting on Client</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Assigned User</label>
          <select id="task-assignee" class="form-control">
            <!-- Rendered dynamically -->
          </select>
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="task-due-date" class="form-control" required>
        </div>
        <div class="form-group" style="grid-column:1/-1;">
          <label>Task Description</label>
          <textarea id="task-desc" class="form-control" rows="3" placeholder="Provide task requirements..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('add-task-modal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Task</button>
      </div>
    </form>
  </div>
</div>

<!-- FILE PREVIEW MODAL -->
<div id="preview-file-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3 id="preview-file-title" class="modal-title">Document Preview</h3>
      <button class="modal-close-btn" onclick="closeModal('preview-file-modal')">&times;</button>
    </div>
    <div id="preview-file-body" class="modal-body"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal('preview-file-modal')">Close</button>
    </div>
  </div>
</div>
